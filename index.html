<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>市外局番 · Japon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#151B21;--ink-2:#1F272E;--ink-3:#2D3944;--text:#E7EBEE;--muted:#8794A0;
 --right:#2E7D5B;--wrong:#C43D2E;--amber:#E0A63C;--sea:#101C25;--land:#38444E;--brd:#7A8A96;--r:4px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;
 font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
#app{height:100dvh;max-width:960px;margin:0 auto;display:flex;flex-direction:column}
#rail{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--ink-3);
 flex:0 0 auto;font-size:13px;flex-wrap:wrap}
#rail .stat{display:flex;gap:5px;align-items:baseline}
#rail .stat b{font-weight:600;font-variant-numeric:tabular-nums}
#rail .stat span{color:var(--muted)}
#rail .spacer{flex:1}
.railbtn{background:none;border:1px solid var(--ink-3);color:var(--muted);font:inherit;font-size:12px;
 padding:3px 9px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.railbtn:hover{color:var(--text);border-color:var(--muted)}
.railbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#151B21;font-weight:600}
#prompt{flex:0 0 auto;padding:12px 13px 8px;text-align:center}
#code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(2.6rem,13vw,4.4rem);
 line-height:1;color:var(--amber)}
#code .paren{color:var(--muted);font-weight:500}
#code.jp{font-family:'Noto Sans JP',sans-serif;font-size:clamp(2rem,9vw,3.2rem);font-weight:700}
#code .ro{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:.34em;font-weight:500;
 color:var(--muted);margin-top:4px;letter-spacing:.02em}
#ask{color:var(--muted);font-size:13px;margin-top:5px}
#maparea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 9px 9px;gap:8px}
#mapsvg{flex:1 1 auto;min-height:170px;width:100%;background:var(--sea);border:1px solid var(--ink-3);
 border-radius:var(--r);touch-action:none;cursor:crosshair;display:block}
#mapsvg .p{fill:var(--land);stroke:var(--sea);stroke-width:.5;vector-effect:non-scaling-stroke}
#mapsvg .lbl{fill:#F3E6C9;font-family:'Noto Sans JP','IBM Plex Sans',sans-serif;font-weight:600;
 paint-order:stroke;stroke:var(--sea);stroke-width:3px;vector-effect:non-scaling-stroke}
#mapsvg .lbl.mono{font-family:'IBM Plex Mono',monospace}
#mapsvg .lbl.dark{fill:#12171C;stroke:rgba(255,255,255,.65);stroke-width:2.4px}
#note .chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#151B21}
#note .exc{margin-top:7px}
#mapsvg .dot{fill:var(--amber);stroke:var(--sea);stroke-width:.5;vector-effect:non-scaling-stroke}
#mapbar{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-height:40px}
#msg{flex:1;font-size:13px;color:var(--muted)}
#msg.good{color:var(--right);font-weight:500}
#msg.bad{color:var(--wrong);font-weight:500}
#msg b{color:var(--text)}
#msg .jp{font-family:'Noto Sans JP',sans-serif}
#btn-ok,#btn-next{display:none;border:none;font:inherit;font-size:14px;font-weight:600;padding:9px 18px;
 border-radius:var(--r);cursor:pointer}
#btn-ok{background:var(--amber);color:#151B21}
#btn-next{background:var(--ink-3);color:var(--text);border:1px solid var(--muted)}
#btn-ok.on,#btn-next.on{display:block}
#note{flex:0 0 auto;display:none;font-size:13px;color:var(--muted);background:var(--ink-2);
 border-left:2px solid var(--amber);border-radius:0 var(--r) var(--r) 0;padding:8px 11px;line-height:1.5}
#note.on{display:block}
#note b{color:var(--text)}
.overlay{position:fixed;inset:0;background:var(--ink);display:none;flex-direction:column;z-index:20}
.overlay.open{display:flex}
.ov-head{display:flex;align-items:center;gap:12px;padding:13px;background:var(--ink-2);
 border-bottom:1px solid var(--ink-3);flex:0 0 auto}
.ov-head h2{font-size:16px;font-weight:600}
.ov-head .spacer{flex:1}
.ov-body{flex:1 1 auto;overflow:auto;padding:13px;max-width:960px;margin:0 auto;width:100%}
.ov-body p{color:var(--muted);font-size:13px;margin-bottom:12px;max-width:66ch}
fieldset{border:none;margin-bottom:18px}
legend{font-size:13px;font-weight:600;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ink-2);border:1px solid var(--ink-3);color:var(--muted);font:inherit;font-size:13px;
 padding:6px 11px;border-radius:var(--r);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#151B21;font-weight:500}
.danger{border-color:var(--wrong);color:var(--wrong)}
.blockkey{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.blockkey span{font-size:12px;padding:3px 9px;border-radius:var(--r);color:#12171C;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{border-bottom:1px solid var(--ink-2);padding:5px 6px;text-align:left}
.tbl th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase}
.tbl .c{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--amber);width:4em}
.tbl .kj{font-family:'Noto Sans JP',sans-serif;font-weight:600}
.tbl .sub{color:var(--muted)}
.tbl .km{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.exc{border-left:2px solid var(--amber);padding:7px 11px;margin-bottom:9px;background:var(--ink-2);
 border-radius:0 var(--r) var(--r) 0}
.exc h4{font-size:13px;margin-bottom:3px}
.exc h4 code{font-family:'IBM Plex Mono',monospace;color:var(--amber)}
.exc p{font-size:13px;color:var(--muted);margin:0;max-width:66ch}
.bar{height:5px;background:var(--wrong);border-radius:2px;display:block}
</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <div class="stat"><b id="s-acc">—</b><span>acc</span></div>
    <div class="stat"><b id="s-streak">0</b><span>série</span></div>
    <div class="stat"><b id="s-n">0</b><span>vus</span></div>
    <div class="spacer"></div>
    <button class="railbtn" id="m-codes">Indicatifs</button>
    <button class="railbtn" id="m-exc">Exceptions</button>
    <button class="railbtn" id="m-pref">Préfectures</button>
    <button class="railbtn" id="m-atlas">Atlas</button>
    <button class="railbtn" id="btn-stats">Stats</button>
    <button class="railbtn" id="btn-settings">Réglages</button>
  </div>
  <div id="prompt"><div id="code">—</div><div id="ask">Où est-ce ?</div></div>
  <div id="maparea">
    <svg id="mapsvg" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="note"></div>
    <div id="mapbar"><span id="msg">Clique sur la carte.</span>
      <button id="btn-ok">Valider</button><button id="btn-next">Suivant</button></div>
  </div>
</div>

<div class="overlay" id="ov-stats">
  <div class="ov-head"><h2>Où tu te trompes</h2><div class="spacer"></div>
    <button class="railbtn" data-close>Fermer</button></div>
  <div class="ov-body"><div id="statsbody"></div></div>
</div>

<div class="overlay" id="ov-settings">
  <div class="ov-head"><h2>Réglages</h2><div class="spacer"></div>
    <button class="railbtn" data-close>Fermer</button></div>
  <div class="ov-body">
    <fieldset><legend>Niveau</legend>
      <div class="chips" id="lvl-chips">
        <button class="chip" data-lvl="macro">Bloc seulement</button>
        <button class="chip" data-lvl="two">Bloc puis aire</button>
        <button class="chip" data-lvl="exact">Aire directement</button>
      </div>
      <p style="margin-top:7px" id="lvl-note"></p>
    </fieldset>
    <fieldset><legend>Blocs travaillés</legend>
      <div class="chips" id="blk-chips"></div>
      <p style="margin-top:7px">Aucune sélection = tous.</p>
    </fieldset>
    <fieldset><legend>Enchaînement</legend>
      <div class="chips" id="adv-chips">
        <button class="chip" data-adv="auto">Automatique</button>
        <button class="chip" data-adv="manual">Attendre</button>
      </div>
    </fieldset>
    <fieldset><legend>Données</legend>
      <div class="chips">
        <button class="chip" id="btn-export">Exporter JSON</button>
        <button class="chip danger" id="btn-reset">Tout remettre à zéro</button>
      </div>
      <p style="margin-top:9px;font-size:12px">Build <b id="buildstamp">—</b></p>
    </fieldset>
  </div>
</div>

  const l = codesOfBlock(b);

};
const CELLS = {};
function cellsOf(b){
  if(CELLS[b]) return CELLS[b];
  const k = blockK(b), list = codesOfBlock(b);
  const bb = bboxOf([...BLOCK_PREFS[b]]), pad = 8;
  const pts = list.map(c => [c.lo*k, c.la]);
  const box = [[(bb.x0-pad)*k, bb.y0-pad], [(bb.x1+pad)*k, bb.y0-pad],
               [(bb.x1+pad)*k, bb.y1+pad], [(bb.x0-pad)*k, bb.y1+pad]];
  const cells = list.map((c,i) => {
    let poly = box;
    for(let j=0;j<pts.length && poly.length;j++) if(j!==i) poly = clipHP(poly, pts[i], pts[j]);
    return {c, d: poly.length ? "M" + poly.map(p => (p[0]/k).toFixed(2) + " " + (-p[1]).toFixed(2)).join("L") + "Z" : ""};
  });
  return (CELLS[b] = cells);
}
function cellAt(b, lat, lon){
  const k = blockK(b);
  let best = null;
  codesOfBlock(b).forEach(c => {
    const d = (lon*k - c.lo*k)**2 + (lat - c.la)**2;
    if(!best || d < best.d) best = {c, d};
  });
  return best ? best.c : null;
}

/* ============================================================
   STATE
   ============================================================ */
const SKEY = "jpcodes.v1";
const DEF = { w:{}, hit:{}, tot:{}, bhit:{}, btot:{}, phit:{}, ptot:{},
              seen:0, right:0, streak:0, best:0, lvl:"two", blks:[], adv:"auto", mode:"codes" };
let S = load();
function load(){ try{ const r = localStorage.getItem(SKEY); return r ? {...DEF, ...JSON.parse(r)} : {...DEF}; }
  catch(e){ return {...DEF}; } }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
const wOf = k => S.w[k] ?? 1;
const setW = (k,v) => { S.w[k] = Math.min(8, Math.max(0.25, v)); };
const startPhase = () => S.lvl === "exact" ? 2 : 1;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pick = a => a[(Math.random()*a.length)|0];

function activeCodes(){
  if(S.mode === "exc") return CODES.filter(c => EXC_CODES.includes(c.code));
  const b = S.blks && S.blks.length ? S.blks.map(Number) : null;
  const l = CODES.filter(c => !b || b.includes(c.blk));
  return l.length ? l : CODES;
}

/* ============================================================
   MAP
   ============================================================ */
const HOME = { x:BB.x0-0.8, y:-(BB.y1+0.8), w:(BB.x1-BB.x0)+1.6, h:(BB.y1-BB.y0)+1.6 };
const MV = { x:HOME.x, y:HOME.y, w:HOME.w, h:HOME.h };
let sel = null, locked = false;
const mapEl = () => document.getElementById("mapsvg");
function clampView(){
  MV.w = Math.max(0.35, Math.min(HOME.w*1.4, MV.w));
  MV.h = Math.max(0.35, Math.min(HOME.h*1.4, MV.h));
  MV.x = Math.min(BB.x1+2-MV.w, Math.max(BB.x0-2, MV.x));
  MV.y = Math.min(-BB.y0+2-MV.h, Math.max(-BB.y1-2, MV.y));
}
const applyView = () => mapEl().setAttribute("viewBox", `${MV.x} ${MV.y} ${MV.w} ${MV.h}`);
function fitInfo(){
  const r = mapEl().getBoundingClientRect();
  const s = Math.min(r.width/MV.w, r.height/MV.h);
  return {r, s, ox:(r.width-MV.w*s)/2, oy:(r.height-MV.h*s)/2};
}
function toMap(cx, cy){
  const f = fitInfo();
  return { lon: MV.x + (cx-f.r.left-f.ox)/f.s, lat: -(MV.y + (cy-f.r.top-f.oy)/f.s) };
}
/* Tokyo reaches the Ogasawara islands a thousand kilometres south, and Kagoshima
   the Satsunan chain — framing on prefecture outlines squeezed Kantō into a
   corner of empty sea. Frame on the points of interest instead. */
function frameOnPoints(pts, pad){
  const las = pts.map(p=>p[0]), los = pts.map(p=>p[1]);
  const cx = (Math.min(...los)+Math.max(...los))/2, cy = (Math.min(...las)+Math.max(...las))/2;
  MV.w = Math.max((Math.max(...los)-Math.min(...los))*pad, 1.6);
  MV.h = Math.max((Math.max(...las)-Math.min(...las))*pad, 1.6);
  MV.x = cx - MV.w/2; MV.y = -(cy + MV.h/2);
  clampView(); applyView();
}
function frameOn(keys, pad){
  const b = bboxOf(keys);
  const cx = (b.x0+b.x1)/2, cy = (b.y0+b.y1)/2;
  MV.w = Math.max((b.x1-b.x0)*pad, 1.6);
  MV.h = Math.max((b.y1-b.y0)*pad, 1.6);
  MV.x = cx - MV.w/2; MV.y = -(cy + MV.h/2);
  clampView(); applyView();
}

/* Crowded areas — nine codes around Tokyo Bay, six in Hokkaidō — need labels
   pushed clear with a thin line back to the point, the way printed maps do it.
   Vertical nudging alone produced an unreadable stack. */
function placeLabels(items, fs, span){
  const put = [];
  return items.map(it => {
    let y = it.y0;
    for(let i = 0; i < put.length; i++){
      const q = put[i];
      if(Math.abs(q.y - y) < fs*1.05 && Math.abs(q.x - it.x) < span){ y = q.y + fs*1.2; i = -1; }
    }
    put.push({x: it.x, y});
    return {...it, y, moved: Math.abs(y - it.y0) > fs*0.7};
  });
}
function labelSvg(items, fs, span, cls){
  return placeLabels(items, fs, span).map(it => {
    let s = "";
    if(it.moved) s += `<line stroke="rgba(255,255,255,.3)" stroke-width="0.5" vector-effect="non-scaling-stroke"
      x1="${it.x}" y1="${it.y0.toFixed(2)}" x2="${it.x}" y2="${(it.y - fs*0.75).toFixed(2)}"/>`;
    s += `<text class="lbl ${cls||""}" x="${it.x}" y="${it.y.toFixed(2)}" font-size="${fs}"
      text-anchor="middle">${it.t}</text>`;
    return s;
  }).join("");
}

function draw(){
  const el = mapEl(); if(!el || !round) return;
  const fs = (MV.w/26).toFixed(3), r = (MV.w/200).toFixed(3);
  let h = "";

  if(round.kind === "atlas"){
    const fs2 = (MV.w/26).toFixed(3);
    if(atlasTab === "pref"){
      PKEYS.forEach(k => h += `<path d="${prefPath(k)}" fill="${REG_COLOR[PREF[k].reg]}"
        fill-opacity="${sel === k ? .95 : .62}" stroke="rgba(0,0,0,.4)" stroke-width="${sel===k?2.2:.7}"
        vector-effect="non-scaling-stroke"/>`);
      h += labelSvg(PKEYS.slice().sort((a,b)=>PREF[b].c[0]-PREF[a].c[0]).map(k => ({
        x: PREF[k].c[1], y0: -PREF[k].c[0], t: esc(PREF[k].kj)
      })), +(fs2*0.4), MV.w/7, "dark");
    } else {
      BLOCKS.forEach(b => h += `<path d="${blockPath(b)}" fill="${BLOCK_COLOR[b]}" fill-opacity=".62"
        stroke="rgba(0,0,0,.4)" stroke-width=".7" vector-effect="non-scaling-stroke"/>`);
      CODES.forEach(c => h += `<circle class="dot" cx="${c.lo}" cy="${-c.la}" r="${(MV.w/240).toFixed(3)}"/>`);
      h += labelSvg(CODES.slice().sort((a,b)=>b.la-a.la).map(c => ({
        x: c.lo, y0: -c.la - MV.w/60,
        t: esc(c.code) + (MV.w < 12 ? " " + esc(c.kj) : "")
      })), +(fs2*0.4), MV.w/7, "dark mono");
    }
    el.innerHTML = h; return;
  }

  if(round.kind === "pref"){
    const t = round.key, rg = round.reg, first = round.phase === 1;
    if(first){
      REG_ORDER.forEach(g => {
        let op = 0.55, st = "rgba(0,0,0,.45)", sw = 0.9;
        if(locked){ if(g===rg){op=.92;sw=2.2;st="#fff";} else if(g===sel){op=.9;sw=2.2;st="var(--wrong)";} else op=.16; }
        else if(g===sel){op=.9;sw=2.2;st="#fff";}
        h += `<path d="${inReg(g).map(prefPath).join("")}" fill="${REG_COLOR[g]}" fill-opacity="${op}"
               stroke="${st}" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
      });
      if(locked){
        const c = PREF[t].c;
        h += `<text class="lbl" x="${c[1]}" y="${-c[0]}" font-size="${fs*0.5}" text-anchor="middle">${esc(PREF[t].kj)} ${esc(PREF[t].n)}</text>`;
      }
    } else {
      const list = inReg(rg);
      PKEYS.forEach(k => { if(!list.includes(k)) h += `<path class="p" d="${prefPath(k)}" fill-opacity="0.35"/>`; });
      list.forEach(k => {
        let fill = REG_COLOR[rg], op = .32, st = "rgba(0,0,0,.5)", sw = 1;
        if(locked){ if(k===t){fill="#3FBF85";op=.9;sw=2.2;st="#fff";}
          else if(k===sel){fill="#E05A48";op=.9;sw=2.2;st="#fff";} else op=.16; }
        else if(k===sel){op=.85;sw=2.2;st="#fff";}
        h += `<path d="${prefPath(k)}" fill="${fill}" fill-opacity="${op}" stroke="${st}"
               stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
      });
      if(locked) h += labelSvg(list.slice().sort((a,b)=>PREF[b].c[0]-PREF[a].c[0]).map(k => ({
        x: PREF[k].c[1], y0: -PREF[k].c[0], t: esc(PREF[k].kj) + " " + esc(PREF[k].n)
      })), +(fs*0.42), MV.w/6);
    }
    el.innerHTML = h; return;
  }

  const t = round.code, b = round.blk;
  if(round.phase === 1){
    BLOCKS.forEach(k => {
      let op = .55, st = "rgba(0,0,0,.45)", sw = .9;
      if(locked){ if(k===b){op=.92;sw=2.2;st="#fff";} else if(k===sel){op=.9;sw=2.2;st="var(--wrong)";} else op=.16; }
      else if(k===sel){op=.9;sw=2.2;st="#fff";}
      h += `<path d="${blockPath(k)}" fill="${BLOCK_COLOR[k]}" fill-opacity="${op}"
             stroke="${st}" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
    });
    if(locked){
      h += `<circle class="dot" cx="${t.lo}" cy="${-t.la}" r="${r*1.6}"/>`;
      h += `<text class="lbl" x="${t.lo}" y="${(-t.la - MV.w/40).toFixed(2)}" font-size="${fs*0.42}"
             text-anchor="middle">${esc(t.kj)} ${esc(t.ro)}</text>`;
    }
  } else {
    const prefs = [...BLOCK_PREFS[b]];
    PKEYS.forEach(k => { if(!prefs.includes(k)) h += `<path class="p" d="${prefPath(k)}" fill-opacity="0.35"/>`; });
    h += `<defs><clipPath id="bc">${prefs.map(k=>`<path d="${prefPath(k)}"/>`).join("")}</clipPath></defs>`;
    h += `<g clip-path="url(#bc)">`;
    cellsOf(b).forEach(({c, d}) => {
      if(!d) return;
      let fill = BLOCK_COLOR[b], op = .28, st = "rgba(0,0,0,.5)", sw = 1;
      if(locked){
        if(c.ro === t.ro || TWINS[t.ro] === c.ro){ fill="#3FBF85"; op=.88; sw=2.2; st="#fff"; }
        else if(sel && c.ro === sel.ro){ fill="#E05A48"; op=.88; sw=2.2; st="#fff"; }
        else op = .14;
      } else if(sel && c.ro === sel.ro){ op=.82; sw=2.2; st="#fff"; }
      h += `<path d="${d}" fill="${fill}" fill-opacity="${op}" stroke="${st}"
             stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`;
    });
    h += `</g>`;
    /* city names while asking, the number only on reveal — the pairing is the
       thing being learnt, so the names are the bridge, not the answer */
    codesOfBlock(b).forEach(c => h += `<circle class="dot" cx="${c.lo}" cy="${-c.la}" r="${r}"/>`);
    h += labelSvg(codesOfBlock(b).slice().sort((a,z)=>z.la-a.la).map(c => ({
      x: c.lo, y0: -c.la - MV.w/50,
      t: (locked ? esc(c.code) + " " : "") + esc(c.kj) + " " + esc(c.ro)
    })), +(fs*0.38), MV.w/6);
  }
  el.innerHTML = h;
}

function wire(){
  const el = mapEl(); if(el.dataset.on) return; el.dataset.on = "1";
  const act = new Map(); let moved = 0, last = null, pinch = null;
  el.addEventListener("wheel", e=>{
    e.preventDefault();
    const m = toMap(e.clientX, e.clientY);
    const k = e.deltaY > 0 ? 1.18 : 1/1.18;
    const ratio = Math.max(0.35/MV.w, Math.min(HOME.w*1.4/MV.w, k));
    MV.x = m.lon - (m.lon-MV.x)*ratio;
    MV.y = -m.lat - (-m.lat-MV.y)*ratio;
    MV.w *= ratio; MV.h *= ratio;
    clampView(); applyView(); draw();
  }, {passive:false});
  el.addEventListener("pointerdown", e=>{
    el.setPointerCapture(e.pointerId);
    act.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; last={x:e.clientX,y:e.clientY};
    if(act.size===2){ const [a,b]=[...act.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), w:MV.w}; }
  });
  el.addEventListener("pointermove", e=>{
    if(!act.has(e.pointerId)) return;
    act.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(act.size===2 && pinch){
      const [a,b]=[...act.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d>4){ const target=Math.max(0.35,Math.min(HOME.w*1.4,pinch.w*(pinch.d/d))), ratio=target/MV.w;
        MV.w=target; MV.h*=ratio; clampView(); applyView(); draw(); }
      moved=99; return;
    }
    if(last){
      const dx=e.clientX-last.x, dy=e.clientY-last.y, s=fitInfo().s;
      moved += Math.abs(dx)+Math.abs(dy);
      MV.x -= dx/s; MV.y -= dy/s;
      clampView(); applyView(); draw();
      last={x:e.clientX,y:e.clientY};
    }
  });
  el.addEventListener("pointerup", e=>{
    const single = act.size===1;
    act.delete(e.pointerId);
    if(act.size<2) pinch=null;
    if(!act.size) last=null;
    if(!single || moved>=6 || locked || !round) return;
    const m = toMap(e.clientX, e.clientY);
    if(round.kind === "atlas"){
      if(atlasTab === "pref"){
        const k = prefAt(m.lat, m.lon) || nearestPref(m.lat, m.lon);
        sel = k;
        $("#msg").innerHTML = `<span class="jp">${esc(PREF[k].kj)}</span> <b>${esc(PREF[k].n)}</b> — ${esc(PREF[k].reg)}`;
      } else {
        const k = prefAt(m.lat, m.lon) || nearestPref(m.lat, m.lon);
        const b = BLOCKS.find(x => inBlockPrefs(x, k));
        const c = b ? cellAt(b, m.lat, m.lon) : null;
        sel = null;
        $("#msg").innerHTML = c
          ? `<b>${esc(c.code)}</b> — <span class="jp">${esc(c.kj)}</span> ${esc(c.ro)}, ${esc(c.prefName)} · bloc ${c.blk}`
          : "Hors zone.";
      }
      draw(); return;
    }
    if(round.kind === "pref"){
      if(round.phase === 1){
        const k = prefAt(m.lat, m.lon) || nearestPref(m.lat, m.lon);
        sel = PREF[k].reg;
      } else {
        const list = inReg(round.reg);
        sel = prefAt(m.lat, m.lon, list) || nearestPref(m.lat, m.lon, list);
      }
    } else if(round.phase === 1){
      const k = prefAt(m.lat, m.lon) || nearestPref(m.lat, m.lon);
      /* Tokyo belongs to blocks 3 and 4, Ōsaka to 6 and 7 — so a click resolves
         to the block being asked about when that prefecture serves it */
      sel = inBlockPrefs(round.blk, k) ? round.blk
          : BLOCKS.find(b => inBlockPrefs(b, k)) || null;
      if(!sel){ $("#msg").textContent = "Clique sur le Japon."; return; }
    } else {
      sel = cellAt(round.blk, m.lat, m.lon);
    }
    draw();
    /* In code rounds the question is a number, so naming the pick helps rather
       than leaks. In prefecture rounds the question IS the name — saying it
       back would let you probe the map until it matched. */
    if(round.kind === "pref") $("#msg").textContent = "Valider pour confirmer.";
    else if(round.phase === 1) $("#msg").innerHTML = `Bloc <b>${sel}</b> — ${esc(BLOCK_NAME[sel])}`;
    else $("#msg").innerHTML = `<span class="jp">${esc(sel.kj)}</span> <b>${esc(sel.ro)}</b>`;
    $("#btn-ok").classList.add("on");
  });
  el.addEventListener("pointercancel", e=>{ act.delete(e.pointerId); last=null; pinch=null; });
  window.addEventListener("resize", ()=>{ clampView(); applyView(); draw(); });
}

/* ============================================================
   ROUNDS
   ============================================================ */
let round = null;
function weightedPick(list, keyf){
  const tot = list.reduce((s,x)=>s+wOf(keyf(x)), 0);
  let r = Math.random()*tot;
  for(const x of list){ r -= wOf(keyf(x)); if(r<=0) return x; }
  return list[list.length-1];
}

let atlasTab = "codes";
function newRound(){
  sel = null; locked = false;
  if(S.mode === "atlas"){
    round = {kind:"atlas"};
    $("#code").className = "";
    $("#code").innerHTML = `<span style="font-size:.42em;font-weight:600">${atlasTab==="pref"?"Préfectures":"Indicatifs"}</span>`;
    $("#ask").textContent = "Explore librement — touche une zone pour la lire";
    $("#msg").textContent = "Aucune question ici.";
    $("#msg").className = "";
    $("#btn-ok").classList.remove("on"); $("#btn-next").classList.remove("on");
    $("#note").className = "on";
    $("#note").innerHTML = `<b>Vue</b> ` +
      ["codes","pref","exc"].map(t=>`<button class="chip atab" data-tab="${t}" style="margin-left:5px">${
        t==="codes"?"Indicatifs":t==="pref"?"Préfectures":"Exceptions"}</button>`).join("");
    if(atlasTab === "exc"){
      $("#note").innerHTML += `<div style="margin-top:9px">` + EXCEPTIONS.map(([t,b]) =>
        `<div class="exc"><h4><code>${esc(t)}</code></h4><p>${b}</p></div>`).join("") + `</div>`;
    }
    document.querySelectorAll(".atab").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.tab === atlasTab);
      b.onclick = () => { atlasTab = b.dataset.tab; newRound(); };
    });
    MV.x=HOME.x; MV.y=HOME.y; MV.w=HOME.w; MV.h=HOME.h; clampView(); applyView();
    wire(); draw(); paintRail(); return;
  }
  $("#msg").className = ""; $("#btn-next").classList.remove("on");
  $("#note").className = ""; $("#note").innerHTML = "";
  if(S.mode === "pref"){
    const k = weightedPick(PKEYS, x=>"p:"+x);
    round = {kind:"pref", key:k, reg:PREF[k].reg, phase:startPhase()};
    $("#code").className = "jp";
    $("#code").innerHTML = `${esc(PREF[k].kj)}<span class="ro">${esc(PREF[k].n)}</span>`;
  } else {
    const c = weightedPick(activeCodes(), x=>x.ro);
    round = {kind:"code", code:c, blk:c.blk, phase:startPhase()};
    $("#code").className = "";
    $("#code").innerHTML = `<span class="paren">(</span>${esc(c.code)}<span class="paren">)</span>`;
  }
  wire();
  paintPhase();
}

function paintPhase(){
  const first = round.phase === 1;
  if(round.kind === "pref"){
    $("#ask").textContent = first ? "Choisis la grande région" : `${round.reg} — choisis la préfecture`;
    $("#msg").textContent = first ? "Clique sur une des neuf régions." : "Clique sur une préfecture.";
    if(first){ MV.x=HOME.x; MV.y=HOME.y; MV.w=HOME.w; MV.h=HOME.h; clampView(); applyView(); }
    else frameOnPoints(inReg(round.reg).map(k=>PREF[k].c), 1.9);
  } else {
    $("#ask").textContent = first ? "Choisis le bloc" : `Bloc ${round.blk} — choisis l'aire`;
    $("#msg").textContent = first ? "Clique sur un des neuf blocs." : "Clique sur une aire.";
    if(first){ MV.x=HOME.x; MV.y=HOME.y; MV.w=HOME.w; MV.h=HOME.h; clampView(); applyView(); }
    else frameOnPoints(codesOfBlock(round.blk).map(c=>[c.la, c.lo]), 1.9);
  }
  $("#btn-ok").classList.remove("on");
  draw();
}

function finish(ok, detail, note){
  locked = true;
  S.seen++;
  if(ok){ S.right++; S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
  const key = round.kind === "pref" ? "p:"+round.key : round.code.ro;
  setW(key, ok ? wOf(key)*0.86 : wOf(key)*1.65);
  save();
  $("#msg").innerHTML = detail;
  $("#msg").className = ok ? "good" : "bad";
  $("#btn-ok").classList.remove("on");
  if(note){ $("#note").innerHTML = note; $("#note").className = "on"; }
  if(round.phase === 1){
    if(round.kind === "pref") frameOnPoints(inReg(round.reg).map(k=>PREF[k].c), 1.9);
    else frameOnPoints(codesOfBlock(round.blk).map(c=>[c.la, c.lo]), 1.9);
  }
  draw(); paintRail();
  if(S.adv === "manual") $("#btn-next").classList.add("on");
  else setTimeout(newRound, ok ? 1800 : 3600);
}

function answer(){
  if(!round || locked || sel === null) return;

  if(round.kind === "pref"){
    const t = round.key, rg = round.reg;
    if(round.phase === 1){
      const ok = sel === rg;
      S.ptot[rg] = (S.ptot[rg]||0)+1; if(ok) S.phit[rg] = (S.phit[rg]||0)+1;
      if(!ok) return finish(false, `Tu as pris <b>${esc(sel)}</b>. <span class="jp">${esc(PREF[t].kj)}</span> ${esc(PREF[t].n)} est en <b>${esc(rg)}</b>.`);
      if(S.lvl === "macro" || inReg(rg).length < 2)
        return finish(true, `<span class="jp">${esc(PREF[t].kj)}</span> <b>${esc(PREF[t].n)}</b> — ${esc(rg)}`);
      round.phase = 2; sel = null; paintPhase();
      $("#msg").innerHTML = `<b>${esc(rg)}</b> ✓ — maintenant la préfecture.`;
      $("#msg").className = "good";
      return;
    }
    const ok = sel === t;
    return finish(ok, ok
      ? `<span class="jp">${esc(PREF[t].kj)}</span> <b>${esc(PREF[t].n)}</b> — ${esc(rg)}`
      : `Tu as pris <b>${esc(PREF[sel].n)}</b>. C'était <span class="jp">${esc(PREF[t].kj)}</span> <b>${esc(PREF[t].n)}</b>.`);
  }

  const t = round.code, b = round.blk;
  if(round.phase === 1){
    const ok = sel === b;
    S.btot[b] = (S.btot[b]||0)+1; if(ok) S.bhit[b] = (S.bhit[b]||0)+1;
    if(!ok) return finish(false,
      `Tu as pris le bloc <b>${sel}</b> (${esc(BLOCK_NAME[sel])}). Le ${esc(t.code)} est au bloc <b>${b}</b> — ${esc(BLOCK_NAME[b])}, à <span class="jp">${esc(t.kj)}</span> ${esc(t.ro)}.`,
      excNote(t));
    /* blocks 3 and 6 hold a single area, so a second step would offer one
       choice — Tokyo and Ōsaka finish on the block */
    if(S.lvl === "macro" || codesOfBlock(b).length < 2)
      return finish(true, `<b>${esc(t.code)}</b> — <span class="jp">${esc(t.kj)}</span> ${esc(t.ro)} · bloc ${b}`, excNote(t));
    round.phase = 2; sel = null; paintPhase();
    $("#msg").innerHTML = `Bloc <b>${b}</b> ✓ — maintenant l'aire.`;
    $("#msg").className = "good";
    return;
  }
  const ok = sel.ro === t.ro || TWINS[t.ro] === sel.ro;
  finish(ok, ok
    ? `<b>${esc(t.code)}</b> — <span class="jp">${esc(t.kj)}</span> ${esc(t.ro)}, ${esc(t.prefName)}`
    : `Tu as pris <span class="jp">${esc(sel.kj)}</span> ${esc(sel.ro)} (${esc(sel.code)}). Le ${esc(t.code)} c'est <span class="jp">${esc(t.kj)}</span> <b>${esc(t.ro)}</b>, ${esc(t.prefName)}.`,
    excNote(t));
}

function paintRail(){
  $("#s-acc").textContent = S.seen ? Math.round(100*S.right/S.seen)+"%" : "—";
  $("#s-streak").textContent = S.streak;
  $("#s-n").textContent = S.seen;
  [["m-codes","codes"],["m-exc","exc"],["m-pref","pref"],["m-atlas","atlas"]].forEach(([id,m]) =>
    $("#"+id).setAttribute("aria-pressed", S.mode === m));
}
document.addEventListener("keydown", e=>{
  if(document.querySelector(".overlay.open")){ if(e.key==="Escape") closeAll(); return; }
  if(e.key===" "||e.key==="Enter"){ e.preventDefault();
    if(!locked && sel !== null) answer(); else if(locked) newRound(); }
});
$("#btn-ok").onclick = answer;
$("#btn-next").onclick = newRound;
function setMode(m){ S.mode = m; save(); paintRail(); newRound(); }
$("#m-codes").onclick = ()=>setMode("codes");
$("#m-exc").onclick   = ()=>setMode("exc");
$("#m-pref").onclick  = ()=>setMode("pref");
$("#m-atlas").onclick = ()=>setMode("atlas");

/* ============================================================
   PANELS
   ============================================================ */
function closeAll(){ document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
function paintSettings(){
  document.querySelectorAll("#lvl-chips .chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.lvl===S.lvl));
  document.querySelectorAll("#adv-chips .chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.adv===S.adv));
  document.querySelectorAll("#blk-chips .chip").forEach(c=>c.setAttribute("aria-pressed", S.blks.includes(c.dataset.blk)));
  $("#buildstamp").textContent = BUILD;
  $("#lvl-note").textContent = S.lvl === "two"
    ? "Deux temps : le bloc, puis l'aire si le bloc est juste. Un bloc manqué arrête la manche."
    : S.lvl === "macro" ? "Seulement le bloc." : "Le bloc est donné, tu ne choisis que l'aire.";
}
const bBox = $("#blk-chips");
BLOCKS.forEach(b=>{
  const el = document.createElement("button");
  el.className = "chip"; el.dataset.blk = String(b);
  el.textContent = `${b} · ${BLOCK_NAME[b].split(" (")[0]} (${codesOfBlock(b).length})`;
  el.onclick = ()=>{ const k=String(b);
    S.blks = S.blks.includes(k) ? S.blks.filter(x=>x!==k) : [...S.blks,k];
    save(); paintSettings(); newRound(); };
  bBox.appendChild(el);
});
document.querySelectorAll("#lvl-chips .chip").forEach(c=>c.onclick=()=>{ S.lvl=c.dataset.lvl; save(); paintSettings(); newRound(); });
document.querySelectorAll("#adv-chips .chip").forEach(c=>c.onclick=()=>{ S.adv=c.dataset.adv; save(); paintSettings(); });
$("#btn-settings").onclick = ()=>{ paintSettings(); $("#ov-settings").classList.add("open"); };
$("#btn-reset").onclick = ()=>{ if(!confirm("Effacer toutes les stats ?")) return;
  S = {...DEF}; save(); paintRail(); closeAll(); newRound(); };
$("#btn-export").onclick = ()=>{
  const b = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "jp-codes.json"; a.click(); URL.revokeObjectURL(a.href);
};

function paintStats(){
  const br = BLOCKS.filter(b=>S.btot[b]).map(b=>({b, acc:S.bhit[b]/S.btot[b], tot:S.btot[b]}));
  const cr = CODES.filter(c=>S.tot[c.ro]).map(c=>({c, acc:S.hit[c.ro]/S.tot[c.ro], tot:S.tot[c.ro]})).sort((a,b)=>a.acc-b.acc);
  const pr = REG_ORDER.filter(r=>S.ptot[r]).map(r=>({r, acc:S.phit[r]/S.ptot[r], tot:S.ptot[r]}));
  if(!br.length && !cr.length && !pr.length){ $("#statsbody").innerHTML = `<p>Rien joué pour l'instant.</p>`; return; }
  let h = "";
  if(br.length) h += `<h3 style="font-size:14px;margin-bottom:6px">Blocs</h3><table class="tbl">` +
    br.map(x=>`<tr><td class="c">${x.b}</td><td>${esc(BLOCK_NAME[x.b])}</td>
      <td class="km">${Math.round(100*x.acc)}%</td><td class="km">${x.tot}</td></tr>`).join("") + `</table>`;
  if(pr.length) h += `<h3 style="font-size:14px;margin:16px 0 6px">Régions</h3><table class="tbl">` +
    pr.map(x=>`<tr><td>${esc(x.r)}</td><td class="km">${Math.round(100*x.acc)}%</td>
      <td class="km">${x.tot}</td></tr>`).join("") + `</table>`;
  if(cr.length) h += `<h3 style="font-size:14px;margin:16px 0 6px">Aires</h3><table class="tbl">` +
    cr.map(x=>`<tr><td class="c">${esc(x.c.code)}</td><td class="kj">${esc(x.c.kj)}</td>
      <td class="sub">${esc(x.c.ro)}<span class="bar" style="width:${Math.max(3,Math.round(100*(1-x.acc)))}%"></span></td>
      <td class="km">${Math.round(100*x.acc)}%</td><td class="km">${x.tot}</td></tr>`).join("") + `</table>`;
  $("#statsbody").innerHTML = h;
}
$("#btn-stats").onclick = ()=>{ paintStats(); $("#ov-stats").classList.add("open"); };

paintRail();
newRound();
</script>
</body>
</html>
